name: Compilar LaTeX

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache TeX Live
        uses: actions/cache@v4
        with:
          path: /usr/share/texlive
          key: texlive-full-2024

      - name: Instalar TeX Live
        run: |
          if ! command -v pdflatex &> /dev/null; then
            sudo apt-get update
            sudo apt-get install -y texlive-full biber
          fi

      - name: Compilar PDF
        working-directory: IC-UFF
        run: |
          pdflatex -interaction=nonstopmode tese.tex
          biber tese
          makeglossaries tese
          pdflatex -interaction=nonstopmode tese.tex
          pdflatex -interaction=nonstopmode tese.tex

      - name: Salvar PDF
        uses: actions/upload-artifact@v4
        with:
          name: dissertacao-pdf
          path: IC-UFF/tese.pdf
